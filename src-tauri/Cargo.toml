[package]
name = "ochst-staff"
version = "1.0.1"
description = "OCHST Staff desktop app"
authors = ["OCHST"]
edition = "2021"

[lib]
name = "ochst_staff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
